<svg font-family="Arial, Helvetica, sans-serif" role="img" style="display:block" viewBox="0 0 680 400" width="100%" xmlns="http://www.w3.org/2000/svg">
<title>What small SS_res means: points cluster near the regression line</title>
<desc>On the left, large SS_res means points are scattered far from the regression line with long residuals. On the right, small SS_res means points lie close to the line with short residuals.</desc>
<text style="font-family:'IBM Plex Sans KR',sans-serif;font-size:14px;font-weight:500" text-anchor="middle" x="170" y="30">Large SS_res — Points far from the line</text>
<line stroke="#e2e0d8" stroke-width="0.5" x1="60" x2="60" y1="80" y2="280"></line>
<line stroke="#e2e0d8" stroke-width="0.5" x1="60" x2="300" y1="280" y2="280"></line>
<line stroke="#1a4f8a" stroke-width="1.5" x1="70" x2="290" y1="250" y2="110"></line>
<circle cx="100" cy="190" fill="#8a1a1a" r="4"></circle>
<line stroke="#8a1a1a" stroke-dasharray="3 2" stroke-width="1.5" x1="100" x2="100" y1="190" y2="230"></line>
<circle cx="150" cy="220" fill="#8a1a1a" r="4"></circle>
<line stroke="#8a1a1a" stroke-dasharray="3 2" stroke-width="1.5" x1="150" x2="150" y1="220" y2="187"></line>
<circle cx="200" cy="130" fill="#8a1a1a" r="4"></circle>
<line stroke="#8a1a1a" stroke-dasharray="3 2" stroke-width="1.5" x1="200" x2="200" y1="130" y2="160"></line>
<circle cx="250" cy="170" fill="#8a1a1a" r="4"></circle>
<line stroke="#8a1a1a" stroke-dasharray="3 2" stroke-width="1.5" x1="250" x2="250" y1="170" y2="133"></line>
<text style="font-family:'IBM Plex Sans KR',sans-serif;font-size:12px;fill:#8a1a1a" text-anchor="middle" x="170" y="305">Long residuals (dashed lines)</text>
<text style="font-family:'IBM Plex Sans KR',sans-serif;font-size:12px" text-anchor="middle" x="170" y="321">Predictions far from actual values</text>
<text style="font-family:'IBM Plex Sans KR',sans-serif;font-size:14px;font-weight:500" text-anchor="middle" x="510" y="30">Small SS_res — Points close to the line</text>
<line stroke="#e2e0d8" stroke-width="0.5" x1="400" x2="400" y1="80" y2="280"></line>
<line stroke="#e2e0d8" stroke-width="0.5" x1="400" x2="640" y1="280" y2="280"></line>
<line stroke="#1a4f8a" stroke-width="1.5" x1="410" x2="630" y1="250" y2="110"></line>
<circle cx="440" cy="232" fill="#1a5a2a" r="4"></circle>
<line stroke="#1a5a2a" stroke-dasharray="3 2" stroke-width="1.5" x1="440" x2="440" y1="232" y2="237"></line>
<circle cx="490" cy="200" fill="#1a5a2a" r="4"></circle>
<line stroke="#1a5a2a" stroke-dasharray="3 2" stroke-width="1.5" x1="490" x2="490" y1="200" y2="194"></line>
<circle cx="540" cy="160" fill="#1a5a2a" r="4"></circle>
<line stroke="#1a5a2a" stroke-dasharray="3 2" stroke-width="1.5" x1="540" x2="540" y1="160" y2="155"></line>
<circle cx="590" cy="125" fill="#1a5a2a" r="4"></circle>
<line stroke="#1a5a2a" stroke-dasharray="3 2" stroke-width="1.5" x1="590" x2="590" y1="125" y2="121"></line>
<text style="font-family:'IBM Plex Sans KR',sans-serif;font-size:12px;fill:#1a5a2a" text-anchor="middle" x="510" y="305">Short residuals (dashed lines)</text>
<text style="font-family:'IBM Plex Sans KR',sans-serif;font-size:12px" text-anchor="middle" x="510" y="321">Predictions close to actual values</text>
<text style="font-family:'IBM Plex Sans KR',sans-serif;font-size:12px" text-anchor="middle" x="340" y="365">SS_res = Σ(residual)² → Square each dashed-line length and add them</text>
<text style="font-family:'IBM Plex Sans KR',sans-serif;font-size:12px" text-anchor="middle" x="340" y="383">Shorter residuals mean smaller SS_res and “prediction ŷ ≈ actual y”</text>
</svg>
