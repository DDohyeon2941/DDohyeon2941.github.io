<svg aria-labelledby="figure-title figure-description" height="220" role="img" style="font-family:system-ui,sans-serif;margin-bottom:12px" viewBox="0 0 680 220" width="680" xmlns="http://www.w3.org/2000/svg">
<title id="figure-title">Clustering can group a rising and a stable 85°C reading together</title>
<desc id="figure-description">Left: a rising time series; right: a stable series. Their final values match, but their contexts differ.</desc>
<defs>
<marker id="arr2" markerHeight="6" markerWidth="6" orient="auto-start-reverse" refX="8" refY="5" viewBox="0 0 10 10">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"></path>
</marker>
</defs>
<!-- 왼쪽 패널: 올라가는 중 -->
<rect fill="none" height="150" rx="8" stroke="#e8cc98" stroke-width="0.5" width="260" x="40" y="20"></rect>
<text class="ts" fill="#7a4a00" font-family="IBM Plex Mono, monospace" font-size="11" text-anchor="middle" x="170" y="42">Rising temperature</text>
<!-- 축 -->
<line stroke="#ccc9be" stroke-width="0.5" x1="60" x2="280" y1="148" y2="148"></line>
<line stroke="#ccc9be" stroke-width="0.5" x1="60" x2="60" y1="148" y2="52"></line>
<!-- 상승 라인 -->
<polyline fill="none" points="70,145 100,138 130,128 160,115 190,100 220,84 250,70 270,62" stroke="#1a4f8a" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></polyline>
<!-- 끝점 강조 -->
<circle cx="270" cy="62" fill="#1a4f8a" r="5"></circle>
<text class="ts" fill="#1a4f8a" font-family="IBM Plex Mono, monospace" font-size="11" text-anchor="middle" x="260" y="56">85°C</text>
<!-- 시간 레이블 -->
<text fill="#9b9890" font-family="IBM Plex Mono, monospace" font-size="10" x="65" y="162">−30 min</text>
<text fill="#9b9890" font-family="IBM Plex Mono, monospace" font-size="10" text-anchor="end" x="258" y="162">Now</text>
<!-- 오른쪽 패널: 안정적 -->
<rect fill="none" height="150" rx="8" stroke="#b8d8bf" stroke-width="0.5" width="260" x="380" y="20"></rect>
<text class="ts" fill="#1a5a2a" font-family="IBM Plex Mono, monospace" font-size="11" text-anchor="middle" x="510" y="42">Stable temperature</text>
<!-- 축 -->
<line stroke="#ccc9be" stroke-width="0.5" x1="400" x2="620" y1="148" y2="148"></line>
<line stroke="#ccc9be" stroke-width="0.5" x1="400" x2="400" y1="148" y2="52"></line>
<!-- 안정 라인 -->
<polyline fill="none" points="410,65 440,64 470,66 500,63 530,65 560,64 590,63 610,62" stroke="#1a5a2a" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></polyline>
<!-- 끝점 강조 -->
<circle cx="610" cy="62" fill="#1a5a2a" r="5"></circle>
<text fill="#1a5a2a" font-family="IBM Plex Mono, monospace" font-size="11" text-anchor="middle" x="600" y="56">85°C</text>
<!-- 시간 레이블 -->
<text fill="#9b9890" font-family="IBM Plex Mono, monospace" font-size="10" x="405" y="162">−30 min</text>
<text fill="#9b9890" font-family="IBM Plex Mono, monospace" font-size="10" text-anchor="end" x="598" y="162">Now</text>
<!-- 가운데 화살표 + 설명 -->
<text fill="#8a1a1a" font-family="IBM Plex Sans KR, sans-serif" font-size="12" text-anchor="middle" x="340" y="95">Clustering</text>
<text fill="#8a1a1a" font-family="IBM Plex Sans KR, sans-serif" font-size="12" text-anchor="middle" x="340" y="111">groups both</text>
<text fill="#8a1a1a" font-family="IBM Plex Sans KR, sans-serif" font-size="12" text-anchor="middle" x="340" y="127">together</text>
<line marker-end="url(#arr2)" stroke="#8a1a1a" stroke-dasharray="3 2" stroke-width="1" x1="302" x2="320" y1="110" y2="110"></line>
<line marker-end="url(#arr2)" stroke="#8a1a1a" stroke-dasharray="3 2" stroke-width="1" x1="378" x2="360" y1="110" y2="110"></line>
</svg>
