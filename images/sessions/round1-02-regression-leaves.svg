<svg aria-labelledby="figure-title figure-description" height="280" role="img" style="font-family:system-ui,sans-serif;" viewBox="0 0 760 280" width="760" xmlns="http://www.w3.org/2000/svg"><title id="figure-title">Leaf averages become predictions</title><desc id="figure-description">The existing regression tree stores a different mean yield in each leaf; all observations reaching a leaf share its prediction.</desc>
<!-- 루트 -->
<rect fill="#eaf0f8" height="52" rx="5" stroke="#b8ccdf" stroke-width="1.2" width="220" x="270" y="10"></rect>
<text fill="#1a4f8a" font-family="IBM Plex Sans KR,sans-serif" font-size="12" font-weight="500" text-anchor="middle" x="380" y="30">Temperature &gt; 82°C?</text>
<text fill="#6b6860" font-family="IBM Plex Mono,monospace" font-size="10" text-anchor="middle" x="380" y="48">180 cases · mean yield 91.2%</text>
<line stroke="#9b9890" stroke-dasharray="4 3" stroke-width="1" x1="335" x2="180" y1="62" y2="120"></line>
<text fill="#1a5a2a" font-family="IBM Plex Mono,monospace" font-size="10" x="232" y="97">YES</text>
<line stroke="#9b9890" stroke-dasharray="4 3" stroke-width="1" x1="425" x2="580" y1="62" y2="120"></line>
<text fill="#9b9890" font-family="IBM Plex Mono,monospace" font-size="10" x="516" y="97">NO</text>
<!-- 2단계 왼쪽 -->
<rect fill="#f8eaea" height="52" rx="5" stroke="#dfb8b8" stroke-width="1.2" width="220" x="70" y="120"></rect>
<text fill="#8a1a1a" font-family="IBM Plex Sans KR,sans-serif" font-size="12" font-weight="500" text-anchor="middle" x="180" y="140">Speed &gt; 1,200 rpm?</text>
<text fill="#6b6860" font-family="IBM Plex Mono,monospace" font-size="10" text-anchor="middle" x="180" y="158">High temperature · 74 cases · mean yield 86.1%</text>
<!-- 2단계 오른쪽 -->
<rect fill="#eaf5ec" height="52" rx="5" stroke="#b8d8bf" stroke-width="1.2" width="220" x="470" y="120"></rect>
<text fill="#1a5a2a" font-family="IBM Plex Sans KR,sans-serif" font-size="12" font-weight="500" text-anchor="middle" x="580" y="140">Speed &gt; 1,000 rpm?</text>
<text fill="#6b6860" font-family="IBM Plex Mono,monospace" font-size="10" text-anchor="middle" x="580" y="158">Low temperature · 106 cases · mean yield 94.8%</text>
<!-- 왼쪽 분기선 -->
<line stroke="#9b9890" stroke-dasharray="3 2" stroke-width="1" x1="140" x2="90" y1="172" y2="210"></line>
<line stroke="#9b9890" stroke-dasharray="3 2" stroke-width="1" x1="220" x2="270" y1="172" y2="210"></line>
<text fill="#8a1a1a" font-family="IBM Plex Mono,monospace" font-size="9" x="96" y="198">YES</text>
<text fill="#9b9890" font-family="IBM Plex Mono,monospace" font-size="9" x="224" y="198">NO</text>
<!-- 왼쪽 리프 2개 — 예측값 = 학습 데이터 y 평균 -->
<rect fill="#f8eaea" height="58" rx="5" stroke="#dfb8b8" stroke-width="1.2" width="130" x="30" y="210"></rect>
<text fill="#8a1a1a" font-family="IBM Plex Sans KR,sans-serif" font-size="11" font-weight="500" text-anchor="middle" x="95" y="228">High temp + high speed</text>
<text fill="#8a1a1a" font-family="IBM Plex Mono,monospace" font-size="10" text-anchor="middle" x="95" y="244">28 cases</text>
<text fill="#8a1a1a" font-family="IBM Plex Mono,monospace" font-size="10" text-anchor="middle" x="95" y="260">Predicted yield = 82.3%</text>
<rect fill="#fdf3e0" height="58" rx="5" stroke="#e8cc98" stroke-width="1.2" width="130" x="195" y="210"></rect>
<text fill="#7a4a00" font-family="IBM Plex Sans KR,sans-serif" font-size="11" font-weight="500" text-anchor="middle" x="260" y="228">High temp + low speed</text>
<text fill="#7a4a00" font-family="IBM Plex Mono,monospace" font-size="10" text-anchor="middle" x="260" y="244">46 cases</text>
<text fill="#7a4a00" font-family="IBM Plex Mono,monospace" font-size="10" text-anchor="middle" x="260" y="260">Predicted yield = 88.4%</text>
<!-- 오른쪽 분기선 -->
<line stroke="#9b9890" stroke-dasharray="3 2" stroke-width="1" x1="540" x2="490" y1="172" y2="210"></line>
<line stroke="#9b9890" stroke-dasharray="3 2" stroke-width="1" x1="620" x2="670" y1="172" y2="210"></line>
<text fill="#1a5a2a" font-family="IBM Plex Mono,monospace" font-size="9" x="494" y="198">YES</text>
<text fill="#9b9890" font-family="IBM Plex Mono,monospace" font-size="9" x="624" y="198">NO</text>
<!-- 오른쪽 리프 2개 -->
<rect fill="#eaf5ec" height="58" rx="5" stroke="#b8d8bf" stroke-width="1.2" width="130" x="420" y="210"></rect>
<text fill="#1a5a2a" font-family="IBM Plex Sans KR,sans-serif" font-size="11" font-weight="500" text-anchor="middle" x="485" y="228">Low temp + high speed</text>
<text fill="#1a5a2a" font-family="IBM Plex Mono,monospace" font-size="10" text-anchor="middle" x="485" y="244">61 cases</text>
<text fill="#1a5a2a" font-family="IBM Plex Mono,monospace" font-size="10" text-anchor="middle" x="485" y="260">Predicted yield = 95.7%</text>
<rect fill="#eaf0f8" height="58" rx="5" stroke="#b8ccdf" stroke-width="1.2" width="130" x="590" y="210"></rect>
<text fill="#1a4f8a" font-family="IBM Plex Sans KR,sans-serif" font-size="11" font-weight="500" text-anchor="middle" x="655" y="228">Low temp + low speed</text>
<text fill="#1a4f8a" font-family="IBM Plex Mono,monospace" font-size="10" text-anchor="middle" x="655" y="244">45 cases</text>
<text fill="#1a4f8a" font-family="IBM Plex Mono,monospace" font-size="10" text-anchor="middle" x="655" y="260">Predicted yield = 93.6%</text>
</svg>
