<svg aria-labelledby="figure-title figure-description" height="200" role="img" style="font-family:system-ui,sans-serif;margin-bottom:12px" viewBox="0 0 680 200" width="680" xmlns="http://www.w3.org/2000/svg">
<title id="figure-title">Comparing Euclidean and DTW distances</title>
<desc id="figure-description">Euclidean comparisons depend on time alignment; DTW can identify similar patterns even when shifted in time.</desc>
<!-- 왼쪽: 유클리드 -->
<rect fill="none" height="155" rx="8" stroke="#dfb8b8" stroke-width="0.5" width="270" x="40" y="20"></rect>
<text fill="#8a1a1a" font-family="IBM Plex Mono, monospace" font-size="11" text-anchor="middle" x="175" y="40">Euclidean — aligned timestamps</text>
<!-- 패턴 A (빨강) -->
<polyline fill="none" points="60,145 80,130 100,100 120,80 140,90 160,130 180,145 200,148" stroke="#1a4f8a" stroke-linecap="round" stroke-width="1.5"></polyline>
<!-- 패턴 B (시간 어긋남, 파랑) -->
<polyline fill="none" points="80,145 100,142 120,130 140,100 160,80 180,90 200,120 280,148" stroke="#8a1a1a" stroke-dasharray="5 3" stroke-linecap="round" stroke-width="1.5"></polyline>
<!-- 수직 매칭선 (어긋남) -->
<line stroke="#ccc9be" stroke-dasharray="2 2" stroke-width="0.8" x1="120" x2="120" y1="80" y2="130"></line>
<line stroke="#ccc9be" stroke-dasharray="2 2" stroke-width="0.8" x1="140" x2="140" y1="90" y2="100"></line>
<line stroke="#ccc9be" stroke-dasharray="2 2" stroke-width="0.8" x1="160" x2="160" y1="130" y2="80"></line>
<text fill="#8a1a1a" font-family="IBM Plex Mono, monospace" font-size="10" text-anchor="middle" x="175" y="165">Large distance → “different patterns”</text>
<!-- 오른쪽: DTW -->
<rect fill="none" height="155" rx="8" stroke="#b8d8bf" stroke-width="0.5" width="270" x="380" y="20"></rect>
<text fill="#1a5a2a" font-family="IBM Plex Mono, monospace" font-size="11" text-anchor="middle" x="515" y="40">DTW — flexible time alignment</text>
<!-- 패턴 A -->
<polyline fill="none" points="400,145 420,130 440,100 460,80 480,90 500,130 520,145 540,148" stroke="#1a4f8a" stroke-linecap="round" stroke-width="1.5"></polyline>
<!-- 패턴 B (시간 어긋남) -->
<polyline fill="none" points="420,145 440,142 460,130 480,100 500,80 520,90 540,120 620,148" stroke="#1a5a2a" stroke-dasharray="5 3" stroke-linecap="round" stroke-width="1.5"></polyline>
<!-- DTW 매칭선 (유연하게 맞춤) -->
<line stroke="#b8d8bf" stroke-width="0.8" x1="440" x2="460" y1="100" y2="130"></line>
<line stroke="#b8d8bf" stroke-width="0.8" x1="460" x2="480" y1="80" y2="100"></line>
<line stroke="#b8d8bf" stroke-width="0.8" x1="500" x2="480" y1="80" y2="90"></line>
<text fill="#1a5a2a" font-family="IBM Plex Mono, monospace" font-size="10" text-anchor="middle" x="515" y="165">Small distance → “same pattern”</text>
<!-- 범례 -->
<line stroke="#1a4f8a" stroke-width="1.5" x1="260" x2="280" y1="75" y2="75"></line>
<text fill="#6b6860" font-family="IBM Plex Mono, monospace" font-size="10" x="283" y="78">Pattern A</text>
<line stroke="#8a1a1a" stroke-dasharray="5 3" stroke-width="1.5" x1="260" x2="280" y1="91" y2="91"></line>
<text fill="#6b6860" font-family="IBM Plex Mono, monospace" font-size="10" x="283" y="94">Pattern B (20 min delayed)</text>
</svg>
