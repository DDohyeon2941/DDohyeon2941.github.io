<?xml version="1.0" encoding="UTF-8"?>
<svg role="img" style="margin-bottom:16px;font-family:system-ui, -apple-system, &quot;Segoe UI&quot;, sans-serif;font-size:15px;color:rgb(37, 43, 48)" viewBox="0 0 720 180" width="720" xmlns="http://www.w3.org/2000/svg" height="180">
<title>Lag features and rolling statistics</title>

<line stroke="#e2e0d8" stroke-width="1" x1="30" x2="690" y1="50" y2="50"></line>
<text fill="#9b9890" font-family="IBM Plex Mono, monospace" font-size="10" text-anchor="middle" x="360" y="24">Time →</text>

<circle cx="100" cy="50" fill="#e2e0d8" r="6"></circle>
<circle cx="200" cy="50" fill="#e2e0d8" r="6"></circle>
<circle cx="300" cy="50" fill="#e2e0d8" r="6"></circle>
<circle cx="400" cy="50" fill="#e2e0d8" r="6"></circle>
<circle cx="500" cy="50" fill="#1a4f8a" r="6"></circle>
<circle cx="600" cy="50" fill="#8a1a1a" r="6"></circle>

<text fill="#9b9890" font-family="IBM Plex Mono, monospace" font-size="9" text-anchor="middle" x="100" y="72">t-4</text>
<text fill="#9b9890" font-family="IBM Plex Mono, monospace" font-size="9" text-anchor="middle" x="200" y="72">t-3</text>
<text fill="#9b9890" font-family="IBM Plex Mono, monospace" font-size="9" text-anchor="middle" x="300" y="72">t-2</text>
<text fill="#9b9890" font-family="IBM Plex Mono, monospace" font-size="9" text-anchor="middle" x="400" y="72">t-1</text>
<text fill="#1a4f8a" font-family="IBM Plex Mono, monospace" font-size="9" font-weight="500" text-anchor="middle" x="500" y="72">t (now)</text>
<text fill="#8a1a1a" font-family="IBM Plex Mono, monospace" font-size="9" text-anchor="middle" x="600" y="72">t+1 ⚠</text>

<line stroke="#1a4f8a" stroke-dasharray="3 2" stroke-width="1" x1="400" x2="400" y1="90" y2="110"></line>
<line stroke="#1a4f8a" stroke-dasharray="3 2" stroke-width="1" x1="500" x2="500" y1="90" y2="110"></line>
<line stroke="#1a4f8a" stroke-width="1.5" x1="400" x2="500" y1="100" y2="100"></line>
<text fill="#1a4f8a" font-family="IBM Plex Mono, monospace" font-size="10" text-anchor="middle" x="450" y="125">lag_1</text>

<line stroke="#1a5a2a" stroke-dasharray="3 2" stroke-width="1" x1="200" x2="200" y1="135" y2="155"></line>
<line stroke="#1a5a2a" stroke-dasharray="3 2" stroke-width="1" x1="500" x2="500" y1="135" y2="155"></line>
<line stroke="#1a5a2a" stroke-width="1.5" x1="200" x2="500" y1="145" y2="145"></line>
<text fill="#1a5a2a" font-family="IBM Plex Mono, monospace" font-size="10" text-anchor="middle" x="350" y="168">rolling_mean(window=4)</text>

<rect fill="#f8eaea" height="30" rx="4" stroke="#dfb8b8" width="100" x="560" y="82"></rect>
<text fill="#8a1a1a" font-family="IBM Plex Sans KR, sans-serif" font-size="10" font-weight="500" text-anchor="middle" x="610" y="101">Future information = leakage</text>
</svg>