<svg xmlns="http://www.w3.org/2000/svg" width="680" height="244" viewBox="0 0 680 244" role="img" aria-labelledby="title desc">
<title id="title">Class-aware image generation</title>
<desc id="desc">All images → Autoencoder → Class-specific latent distribution → Decoder → Generated images. The original five-stage flow is wrapped into two rows for legibility.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#108e80"/></marker></defs>
<rect width="680" height="244" fill="#f7f8fc"/>
<g font-family="Arial, Helvetica, sans-serif">
<rect x="20" y="20" width="190" height="82" fill="#fff" stroke="#22315b" stroke-width="2"/>
<text x="115.0" y="56.0" font-size="24" fill="#22315b" font-weight="500" text-anchor="middle">
<tspan x="115.0" dy="0">All</tspan>
<tspan x="115.0" dy="26">images</tspan>
</text>
<rect x="245" y="20" width="190" height="82" fill="#fff" stroke="#22315b" stroke-width="2"/>
<text x="340.0" y="69.0" font-size="23" fill="#22315b" font-weight="500" text-anchor="middle">
<tspan x="340.0" dy="0">Autoencoder</tspan>
</text>
<rect x="470" y="20" width="190" height="82" fill="#108e80" stroke="#108e80" stroke-width="2"/>
<text x="565.0" y="56.0" font-size="21" fill="white" font-weight="500" text-anchor="middle">
<tspan x="565.0" dy="0">Class-specific</tspan>
<tspan x="565.0" dy="26">latent distribution</tspan>
</text>
<path d="M 213 61 H 242" fill="none" stroke="#108e80" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M 438 61 H 467" fill="none" stroke="#108e80" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="470" y="138" width="190" height="82" fill="#fff" stroke="#22315b" stroke-width="2"/>
<text x="565.0" y="187.0" font-size="24" fill="#22315b" font-weight="500" text-anchor="middle">
<tspan x="565.0" dy="0">Decoder</tspan>
</text>
<rect x="245" y="138" width="190" height="82" fill="#22315b" stroke="#22315b" stroke-width="2"/>
<text x="340.0" y="174.0" font-size="24" fill="white" font-weight="500" text-anchor="middle">
<tspan x="340.0" dy="0">Generated</tspan>
<tspan x="340.0" dy="26">images</tspan>
</text>
<path d="M 565 105 V 135" fill="none" stroke="#108e80" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M 467 179 H 438" fill="none" stroke="#108e80" stroke-width="3" marker-end="url(#arrow)"/>
</g></svg>