<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 165"><title>Imbalanced data → classification complexity → oversampling</title><g font-family="system-ui,sans-serif" fill="#252b30"><rect x="12" y="38" width="210" height="90" rx="3" fill="#f1f3f1" stroke="#aab9b4" /><text x="117" y="72" text-anchor="middle" font-size="18" font-weight="600">Imbalanced data</text><text x="117" y="103" text-anchor="middle" font-size="13.65" fill="#626b72">How much data to generate?</text><path d="M225 83h19m-6-5 6 5-6 5" fill="none" stroke="#28645f" stroke-width="2" /><rect x="248" y="38" width="210" height="90" rx="3" fill="#f1f3f1" stroke="#aab9b4" /><text x="353" y="72" text-anchor="middle" font-size="15.44" font-weight="600">Classification complexity</text><text x="353" y="103" text-anchor="middle" font-size="14" fill="#626b72">Difficulty separating classes</text><path d="M461 83h19m-6-5 6 5-6 5" fill="none" stroke="#28645f" stroke-width="2" /><rect x="484" y="38" width="210" height="90" rx="3" fill="#f1f3f1" stroke="#aab9b4" /><text x="589" y="72" text-anchor="middle" font-size="18" font-weight="600">Oversampling</text><text x="589" y="103" text-anchor="middle" font-size="13.58" fill="#626b72">Determine augmentation size</text></g></svg>
