<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 165"><title>불균형 데이터 → 분류 복잡도 → 오버샘플링</title><g font-family="system-ui,sans-serif" fill="#252b30"><rect x="12" y="38" width="210" height="90" rx="3" fill="#f1f3f1" stroke="#aab9b4"/><text x="117" y="72" text-anchor="middle" font-size="20" font-weight="600">불균형 데이터</text><text x="117" y="103" text-anchor="middle" font-size="16" fill="#626b72">생성량 결정 문제</text><path d="M225 83h19m-6-5 6 5-6 5" fill="none" stroke="#28645f" stroke-width="2"/><rect x="248" y="38" width="210" height="90" rx="3" fill="#f1f3f1" stroke="#aab9b4"/><text x="353" y="72" text-anchor="middle" font-size="20" font-weight="600">분류 복잡도</text><text x="353" y="103" text-anchor="middle" font-size="16" fill="#626b72">클래스 구분 난이도</text><path d="M461 83h19m-6-5 6 5-6 5" fill="none" stroke="#28645f" stroke-width="2"/><rect x="484" y="38" width="210" height="90" rx="3" fill="#f1f3f1" stroke="#aab9b4"/><text x="589" y="72" text-anchor="middle" font-size="20" font-weight="600">오버샘플링</text><text x="589" y="103" text-anchor="middle" font-size="16" fill="#626b72">크기 산출 연구</text></g></svg>