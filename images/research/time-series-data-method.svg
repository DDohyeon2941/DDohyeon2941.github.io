<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 165"><title>서로 다른 기록 → 비교 기준 정리 → 학습·평가</title><g font-family="system-ui,sans-serif" fill="#252b30"><rect x="12" y="38" width="210" height="90" rx="3" fill="#f1f3f1" stroke="#aab9b4"/><text x="117" y="72" text-anchor="middle" font-size="20" font-weight="600">서로 다른 기록</text><text x="117" y="103" text-anchor="middle" font-size="16" fill="#626b72">시점·의미 확인</text><path d="M225 83h19m-6-5 6 5-6 5" fill="none" stroke="#28645f" stroke-width="2"/><rect x="248" y="38" width="210" height="90" rx="3" fill="#f1f3f1" stroke="#aab9b4"/><text x="353" y="72" text-anchor="middle" font-size="20" font-weight="600">비교 기준 정리</text><text x="353" y="103" text-anchor="middle" font-size="16" fill="#626b72">정렬·품질 검토</text><path d="M461 83h19m-6-5 6 5-6 5" fill="none" stroke="#28645f" stroke-width="2"/><rect x="484" y="38" width="210" height="90" rx="3" fill="#f1f3f1" stroke="#aab9b4"/><text x="589" y="72" text-anchor="middle" font-size="20" font-weight="600">학습·평가</text><text x="589" y="103" text-anchor="middle" font-size="16" fill="#626b72">사용 시점 정보 기준</text></g></svg>