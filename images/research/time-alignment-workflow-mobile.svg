<svg xmlns="http://www.w3.org/2000/svg" width="380" height="580" viewBox="0 0 380 580" role="img" aria-labelledby="title desc">
  <title id="title">Time alignment around a shared prediction point</title>
  <desc id="desc">A mobile conceptual illustration of generic frequent, less frequent, and irregular record streams. Dark records are available by the shared prediction time; grey records are later. Timing, meaning, and quality checks support aligned data and consistent criteria for training, use, and evaluation. No actual intervals, source fields, measurements, or implementation are shown.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0 8 4 0 8Z" fill="#58636d"/></marker>
  </defs>
  <rect width="380" height="580" fill="#fff"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#26313b">
    <text x="14" y="28" font-size="22" font-weight="700">Time alignment</text>
    <text x="14" y="53" font-size="16" fill="#58636d">Use information available at prediction time.</text>

    <rect x="12" y="74" width="356" height="211" rx="5" fill="#fafafa" stroke="#d9dee2"/>
    <text x="25" y="99" font-size="18" font-weight="700">Different recording patterns</text>
    <rect x="149" y="137" width="137" height="116" fill="#eff2f4"/>
    <text x="286" y="122" font-size="16" text-anchor="middle" font-weight="700">Prediction time</text>
    <path d="M286 133V255" fill="none" stroke="#58636d" stroke-width="1.5" stroke-dasharray="4 4"/>

    <text x="25" y="154" font-size="16">Frequent</text>
    <text x="25" y="200" font-size="16">Less frequent</text>
    <text x="25" y="246" font-size="16">Irregular</text>
    <g fill="none" stroke-width="1.5">
      <path d="M153 148H286M153 194H286M153 240H286" stroke="#58636d"/>
      <path d="M286 148H355M286 194H355M286 240H355" stroke="#c3cbd1" stroke-dasharray="3 3"/>
    </g>
    <g fill="#344657">
      <circle cx="160" cy="148" r="3.5"/><circle cx="179" cy="148" r="3.5"/><circle cx="198" cy="148" r="3.5"/><circle cx="217" cy="148" r="3.5"/><circle cx="236" cy="148" r="3.5"/><circle cx="255" cy="148" r="3.5"/><circle cx="276" cy="148" r="3.5"/>
      <circle cx="160" cy="194" r="3.5"/><circle cx="198" cy="194" r="3.5"/><circle cx="236" cy="194" r="3.5"/><circle cx="276" cy="194" r="3.5"/>
      <circle cx="160" cy="240" r="3.5"/><circle cx="178" cy="240" r="3.5"/><circle cx="220" cy="240" r="3.5"/><circle cx="269" cy="240" r="3.5"/><circle cx="279" cy="240" r="3.5"/>
      <circle cx="29" cy="267" r="3.5"/>
    </g>
    <g fill="#c3cbd1">
      <circle cx="309" cy="148" r="3.5"/><circle cx="330" cy="148" r="3.5"/><circle cx="352" cy="148" r="3.5"/>
      <circle cx="309" cy="194" r="3.5"/><circle cx="352" cy="194" r="3.5"/>
      <circle cx="314" cy="240" r="3.5"/><circle cx="352" cy="240" r="3.5"/>
      <circle cx="199" cy="267" r="3.5"/>
    </g>
    <text x="40" y="272" font-size="16">Available records</text>
    <text x="210" y="272" font-size="16" fill="#58636d">Later records</text>

    <rect x="12" y="307" width="356" height="84" rx="5" fill="#fff" stroke="#d9dee2"/>
    <text x="25" y="333" font-size="18" font-weight="700">Alignment &amp; quality review</text>
    <text x="25" y="357" font-size="16" fill="#58636d">Compare timing and meaning</text>
    <text x="25" y="379" font-size="16" fill="#58636d">Check missing or inconsistent records</text>
    <path d="M190 396V412" fill="none" stroke="#58636d" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect x="12" y="422" width="356" height="55" rx="5" fill="#fafafa" stroke="#d9dee2"/>
    <text x="190" y="445" font-size="20" text-anchor="middle" font-weight="700">Aligned data</text>
    <text x="190" y="467" font-size="16" text-anchor="middle" fill="#58636d">Comparable time basis</text>
    <path d="M190 483V499" fill="none" stroke="#58636d" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect x="12" y="507" width="356" height="62" rx="5" fill="#fff" stroke="#d9dee2"/>
    <text x="190" y="532" font-size="18" text-anchor="middle" font-weight="700">Training, use &amp; evaluation</text>
    <text x="190" y="555" font-size="16" text-anchor="middle" fill="#58636d">Apply consistent data criteria</text>
  </g>
</svg>
