<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 165"><title>관광 리뷰 → 지역·월별 결합 → 회귀 분석</title><g font-family="system-ui,sans-serif" fill="#252b30"><rect x="12" y="38" width="210" height="90" rx="3" fill="#f1f3f1" stroke="#aab9b4"/><text x="117" y="72" text-anchor="middle" font-size="20" font-weight="600">관광 리뷰</text><text x="117" y="103" text-anchor="middle" font-size="16" fill="#626b72">토픽·감성 점수</text><path d="M225 83h19m-6-5 6 5-6 5" fill="none" stroke="#28645f" stroke-width="2"/><rect x="248" y="38" width="210" height="90" rx="3" fill="#f1f3f1" stroke="#aab9b4"/><text x="353" y="72" text-anchor="middle" font-size="20" font-weight="600">지역·월별 결합</text><text x="353" y="103" text-anchor="middle" font-size="16" fill="#626b72">생활인구·환경 정보</text><path d="M461 83h19m-6-5 6 5-6 5" fill="none" stroke="#28645f" stroke-width="2"/><rect x="484" y="38" width="210" height="90" rx="3" fill="#f1f3f1" stroke="#aab9b4"/><text x="589" y="72" text-anchor="middle" font-size="20" font-weight="600">회귀 분석</text><text x="589" y="103" text-anchor="middle" font-size="16" fill="#626b72">방문 규모와 관계</text></g></svg>