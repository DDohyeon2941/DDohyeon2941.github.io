<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Scaling comparison — MinMax vs standardization</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@300;400;500&family=IBM+Plex+Mono:wght@400;500&display=swap');
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#f7f6f2;--surface:#fff;--surface2:#f0efe9;
    --border:#e2e0d8;--text:#1a1917;--text2:#6b6860;--text3:#9b9890;
    --blue:#1a4f8a;--blue-bg:#eaf0f8;--blue-border:#b8ccdf;
    --green:#1a5a2a;--green-bg:#eaf5ec;--green-border:#b8d8bf;
    --amber:#7a4a00;--amber-bg:#fdf3e0;--amber-border:#e8cc98;
    --red:#8a1a1a;--red-bg:#f8eaea;--red-border:#dfb8b8;
    --mono:'IBM Plex Mono',monospace;--sans:'IBM Plex Sans KR',sans-serif
  }
  body{font-family:var(--sans);background:var(--bg);color:var(--text);font-size:13px;line-height:1.6;padding:20px}
  h2{font-size:15px;font-weight:500;margin-bottom:4px}
  .subtitle{font-size:12px;color:var(--text2);margin-bottom:16px}
  .controls{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;align-items:center}
  .btn{font-family:var(--mono);font-size:11px;padding:5px 14px;border-radius:4px;cursor:pointer;border:1px solid var(--border);background:var(--surface);color:var(--text2);transition:all .15s}
  .btn.active{background:var(--blue-bg);border-color:var(--blue-border);color:var(--blue);font-weight:500}
  .btn:hover:not(.active){background:var(--surface2)}
  .seed-btn{font-family:var(--mono);font-size:11px;padding:5px 14px;border-radius:4px;cursor:pointer;border:1px solid var(--border);background:var(--surface);color:var(--text2);margin-left:auto}
  .seed-btn:hover{background:var(--surface2)}
  .charts{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:16px}
  @media(max-width:600px){.charts{grid-template-columns:1fr}}
  .chart-wrap{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:12px}
  .chart-wrap.active-raw{border-color:var(--border);background:var(--surface2)}
  .chart-wrap.active-minmax{border-color:var(--blue-border);background:var(--blue-bg)}
  .chart-wrap.active-std{border-color:var(--green-border);background:var(--green-bg)}
  .chart-title{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}
  .chart-wrap.active-raw .chart-title{color:var(--text3)}
  .chart-wrap.active-minmax .chart-title{color:var(--blue)}
  .chart-wrap.active-std .chart-title{color:var(--green)}
  canvas{display:block;width:100%;height:200px}
  .stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:16px}
  .stat-box{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:10px 12px}
  .stat-box.minmax{background:var(--blue-bg);border-color:var(--blue-border)}
  .stat-box.std{background:var(--green-bg);border-color:var(--green-border)}
  .stat-label{font-family:var(--mono);font-size:10px;color:var(--text3);margin-bottom:4px}
  .stat-box.minmax .stat-label{color:var(--blue)}
  .stat-box.std .stat-label{color:var(--green)}
  .stat-vals{display:flex;gap:12px;flex-wrap:wrap}
  .stat-item{font-size:11px;color:var(--text2)}
  .stat-item b{font-family:var(--mono);color:var(--text)}
  .note-box{background:var(--amber-bg);border:1px solid var(--amber-border);border-radius:6px;padding:10px 14px;font-size:12px;color:var(--amber);line-height:1.65}
  .note-box b{font-weight:500}
  .outlier-toggle{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text2);cursor:pointer;user-select:none}
  .outlier-toggle input{cursor:pointer;accent-color:var(--red)}
</style>

<body>
<nav aria-label="Portfolio navigation" class="portfolio-nav"><a href="../../index.html">Home</a><a href="../../research.html">Research</a><a href="../../projects.html">Projects</a><a aria-current="page" href="../../writing.html">Writing &amp; Sessions</a><a href="../../resume.html">CV</a></nav>
<h2>Scaling comparison — Original · MinMax · Standardization</h2>
<div class="subtitle">1,000 samples (temperature and pressure) — Explore the effect of scaling in scatter plots</div>
<div class="controls">
<label class="outlier-toggle">
<input id="outlierToggle" type="checkbox"/> Add 5 outliers
  </label>
<button class="seed-btn" onclick="regenerate()">🎲 Regenerate data</button>
</div>
<div class="charts">
<div class="chart-wrap active-raw">
<div class="chart-title">Original (Raw)</div>
<canvas id="rawChart"></canvas>
</div>
<div class="chart-wrap active-minmax">
<div class="chart-title">MinMax scaling</div>
<canvas id="minmaxChart"></canvas>
</div>
<div class="chart-wrap active-std">
<div class="chart-title">Standardization (Z-score)</div>
<canvas id="stdChart"></canvas>
</div>
</div>
<div class="stats" id="statsArea"></div>
<div class="note-box" id="noteBox"></div>
<script>
const N = 1000;
let seed = 42;
let data = [];

// 간단한 seeded random
function seededRandom(s) {
  let x = Math.sin(s) * 10000;
  return x - Math.floor(x);
}

function generateData(withOutliers) {
  const result = [];
  for (let i = 0; i < N; i++) {
    seed++;
    const u1 = seededRandom(seed);
    seed++;
    const u2 = seededRandom(seed);
    // Box-Muller 변환으로 정규분포
    const z0 = Math.sqrt(-2 * Math.log(u1 + 1e-10)) * Math.cos(2 * Math.PI * u2);
    seed++;
    const u3 = seededRandom(seed);
    seed++;
    const u4 = seededRandom(seed);
    const z1 = Math.sqrt(-2 * Math.log(u3 + 1e-10)) * Math.cos(2 * Math.PI * u4);

    const temp = 80 + z0 * 8;      // 온도: 평균 80, std 8
    const pressure = 5 + z1 * 1.5; // 압력: 평균 5, std 1.5
    result.push([temp, pressure]);
  }
  if (withOutliers) {
    result.push([160, 5.2], [155, 4.8], [158, 5.5], [10, 4.9], [12, 5.1]);
  }
  return result;
}

function stats(arr) {
  const n = arr.length;
  const mean = arr.reduce((a, b) => a + b, 0) / n;
  const std = Math.sqrt(arr.reduce((a, b) => a + (b - mean) ** 2, 0) / n);
  const min = Math.min(...arr);
  const max = Math.max(...arr);
  return { mean, std, min, max };
}

function minmaxScale(arr) {
  const { min, max } = stats(arr);
  return arr.map(v => (v - min) / (max - min + 1e-10));
}

function stdScale(arr) {
  const { mean, std } = stats(arr);
  return arr.map(v => (v - mean) / (std + 1e-10));
}

function drawScatter(canvasId, xs, ys, color, xRange, yRange) {
  const canvas = document.getElementById(canvasId);
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  canvas.width = rect.width * dpr;
  canvas.height = rect.height * dpr;
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  const W = rect.width, H = rect.height;
  const pad = { t: 10, r: 10, b: 30, l: 40 };
  const pw = W - pad.l - pad.r, ph = H - pad.t - pad.b;

  const [xMin, xMax] = xRange;
  const [yMin, yMax] = yRange;

  // 배경
  ctx.fillStyle = 'rgba(255,255,255,0)';
  ctx.fillRect(0, 0, W, H);

  // 격자
  ctx.strokeStyle = '#e2e0d8';
  ctx.lineWidth = 0.5;
  for (let i = 0; i <= 4; i++) {
    const x = pad.l + (pw * i / 4);
    const y = pad.t + (ph * i / 4);
    ctx.beginPath(); ctx.moveTo(x, pad.t); ctx.lineTo(x, pad.t + ph); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(pad.l, y); ctx.lineTo(pad.l + pw, y); ctx.stroke();
  }

  // 축 레이블
  ctx.fillStyle = '#9b9890';
  ctx.font = '9px IBM Plex Mono, monospace';
  ctx.textAlign = 'center';
  for (let i = 0; i <= 4; i++) {
    const val = xMin + (xMax - xMin) * i / 4;
    const x = pad.l + pw * i / 4;
    ctx.fillText(val.toFixed(1), x, H - 8);
  }
  ctx.textAlign = 'right';
  for (let i = 0; i <= 4; i++) {
    const val = yMax - (yMax - yMin) * i / 4;
    const y = pad.t + ph * i / 4;
    ctx.fillText(val.toFixed(1), pad.l - 4, y + 3);
  }

  // 점 그리기
  const alpha = xs.length > 500 ? 0.25 : 0.4;
  ctx.fillStyle = color.replace(')', `, ${alpha})`).replace('rgb', 'rgba');

  for (let i = 0; i < xs.length; i++) {
    const px = pad.l + ((xs[i] - xMin) / (xMax - xMin)) * pw;
    const py = pad.t + ((yMax - ys[i]) / (yMax - yMin)) * ph;
    ctx.beginPath();
    ctx.arc(px, py, 2, 0, Math.PI * 2);
    ctx.fill();
  }
}

function getRanges(xs, ys, pad = 0.05) {
  const xS = stats(xs), yS = stats(ys);
  const xPad = (xS.max - xS.min) * pad;
  const yPad = (yS.max - yS.min) * pad;
  return [[xS.min - xPad, xS.max + xPad], [yS.min - yPad, yS.max + yPad]];
}

function updateStats(rawXs, rawYs, mmXs, mmYs, stXs, stYs) {
  const rX = stats(rawXs), rY = stats(rawYs);
  const mX = stats(mmXs), mY = stats(mmYs);
  const sX = stats(stXs), sY = stats(stYs);

  document.getElementById('statsArea').innerHTML = `
    <div class="stat-box">
      <div class="stat-label">Original (Raw)</div>
      <div class="stat-vals">
        <div class="stat-item">Temperature range: <b>${rX.min.toFixed(1)} ~ ${rX.max.toFixed(1)}</b></div>
        <div class="stat-item">Pressure range: <b>${rY.min.toFixed(2)} ~ ${rY.max.toFixed(2)}</b></div>
      </div>
      <div class="stat-vals" style="margin-top:4px">
        <div class="stat-item">Temperature std: <b>${rX.std.toFixed(1)}</b></div>
        <div class="stat-item">Pressure std: <b>${rY.std.toFixed(2)}</b></div>
      </div>
    </div>
    <div class="stat-box minmax">
      <div class="stat-label">MinMax scaling</div>
      <div class="stat-vals">
        <div class="stat-item">Temperature range: <b>${mX.min.toFixed(2)} ~ ${mX.max.toFixed(2)}</b></div>
        <div class="stat-item">Pressure range: <b>${mY.min.toFixed(2)} ~ ${mY.max.toFixed(2)}</b></div>
      </div>
      <div class="stat-vals" style="margin-top:4px">
        <div class="stat-item">Temperature std: <b>${mX.std.toFixed(3)}</b></div>
        <div class="stat-item">Pressure std: <b>${mY.std.toFixed(3)}</b></div>
      </div>
    </div>
    <div class="stat-box std">
      <div class="stat-label">Standardization (Z-score)</div>
      <div class="stat-vals">
        <div class="stat-item">Temperature range: <b>${sX.min.toFixed(2)} ~ ${sX.max.toFixed(2)}</b></div>
        <div class="stat-item">Pressure range: <b>${sY.min.toFixed(2)} ~ ${sY.max.toFixed(2)}</b></div>
      </div>
      <div class="stat-vals" style="margin-top:4px">
        <div class="stat-item">Temperature std: <b>${sX.std.toFixed(2)}</b></div>
        <div class="stat-item">Pressure std: <b>${sY.std.toFixed(2)}</b></div>
      </div>
    </div>
  `;
}

function updateNote(withOutliers) {
  const base = `
    <b>It is normal for all three scatter plots to show the same distribution shape.</b> MinMax scaling and standardization are monotonic transformations: applying the same formula to every value preserves their relative order and the ratios between gaps. What changes is not the distribution shape but the <b>axis scale</b>.<br><br>
    <b>Original:</b> Temperature is around 60–100°C and pressure around 2–8 bar. Their units and ranges differ substantially. Calculating Euclidean distance at this scale lets temperature dominate pressure.<br><br>
    <b>MinMax:</b> Both variables are compressed into the 0–1 range. The ranges match, but <b>outliers determine 0 and 1</b>. This is suitable when there are no outliers.<br><br>
    <b>Standardization (Z-score):</b> Transforms each variable to mean=0 and std=1. Because the transformation uses the whole distribution, it is more stable than MinMax in the presence of outliers.
  `;
  const outlierNote = withOutliers ? `<br><br>
    <b>When outliers are added:</b> With MinMax scaling, one outlier determines the entire scale, compressing normal observations into the 0–0.5 interval. Standardization is also affected by outliers, but less dramatically than MinMax.
  ` : '';
  document.getElementById('noteBox').innerHTML = base + outlierNote;
}

let currentSeed = 42;

function regenerate() {
  currentSeed = Math.floor(Math.random() * 10000);
  seed = currentSeed;
  render();
}

function render() {
  seed = currentSeed;
  const withOutliers = document.getElementById('outlierToggle').checked;
  data = generateData(withOutliers);

  const rawXs = data.map(d => d[0]);
  const rawYs = data.map(d => d[1]);
  const mmXs = minmaxScale(rawXs);
  const mmYs = minmaxScale(rawYs);
  const stXs = stdScale(rawXs);
  const stYs = stdScale(rawYs);

  // 원본
  const [rxRange, ryRange] = getRanges(rawXs, rawYs);
  drawScatter('rawChart', rawXs, rawYs, 'rgb(107, 104, 96)', rxRange, ryRange);

  // MinMax
  drawScatter('minmaxChart', mmXs, mmYs, 'rgb(26, 79, 138)', [-0.05, 1.05], [-0.05, 1.05]);

  // 표준화
  const [sxRange, syRange] = getRanges(stXs, stYs);
  drawScatter('stdChart', stXs, stYs, 'rgb(26, 90, 42)', sxRange, syRange);

  updateStats(rawXs, rawYs, mmXs, mmYs, stXs, stYs);
  updateNote(withOutliers);
}

document.getElementById('outlierToggle').addEventListener('change', render);
window.addEventListener('resize', render);
window.addEventListener('load', () => { setTimeout(render, 100); });
</script>
<div style="padding:12px 20px;text-align:right;background:#f7f6f2;font:14px/1.5 Arial,sans-serif"><a href="../../writing.html#talks" style="color:#0f766e;text-decoration:underline">← Portfolio · Company ML Sessions</a></div>
